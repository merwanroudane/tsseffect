[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tseffects"
version = "0.5.1"
description = "Dynamic effects from single-equation time series models (with interactions)"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Merwan Roudane", email = "merwanroudane920@gmail.com" },
]
maintainers = [
    { name = "Merwan Roudane", email = "merwanroudane920@gmail.com" },
]
keywords = [
    "time series",
    "econometrics",
    "ARDL",
    "ADL",
    "error correction model",
    "impulse response",
    "interaction effects",
    "delta method",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "sympy>=1.10",
    "statsmodels>=0.13",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
docs = ["sphinx>=7.0", "furo", "numpydoc", "myst-parser"]

[project.urls]
Homepage = "https://merwanroudane.github.io/tsseffect/"
Documentation = "https://merwanroudane.github.io/tsseffect/"
Source = "https://github.com/merwanroudane/tsseffect"
Issues = "https://github.com/merwanroudane/tsseffect/issues"
Changelog = "https://github.com/merwanroudane/tsseffect/blob/main/CHANGELOG.md"
"Original R package" = "https://cran.r-project.org/package=tseffects"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tseffects = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"
filterwarnings = [
    "ignore::UserWarning",
]
