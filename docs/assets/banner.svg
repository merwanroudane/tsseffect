<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="tseffects — dynamic effects from single-equation time series models">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="45%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="bandb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity=".03"/>
    </linearGradient>

    <!-- The Parula ramp, the package's default surface colour scale. -->
    <linearGradient id="parula" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#352a87"/>
      <stop offset="0.20" stop-color="#0f72dd"/>
      <stop offset="0.40" stop-color="#07a0cd"/>
      <stop offset="0.60" stop-color="#4dbd91"/>
      <stop offset="0.80" stop-color="#d1c33b"/>
      <stop offset="1.00" stop-color="#fafa1f"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#16203e" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#sky)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)"/>

  <!-- ============================ left: wordmark ============================ -->
  <g transform="translate(74,0)">
    <text x="0" y="118" font-family="'Segoe UI',Inter,system-ui,sans-serif"
          font-size="68" font-weight="700" fill="#16202e" letter-spacing="-1.5">
      tseffects
    </text>
    <rect x="2" y="134" width="118" height="5" rx="2.5" fill="url(#accent)"/>

    <text x="0" y="176" font-family="'Segoe UI',Inter,system-ui,sans-serif"
          font-size="20.5" font-weight="600" fill="#334155">
      Dynamic effects from single-equation time series models
    </text>
    <text x="0" y="205" font-family="'Segoe UI',Inter,system-ui,sans-serif"
          font-size="17" fill="#64748b">
      Impulse and step responses, long-run multipliers and conditional effects
    </text>
    <text x="0" y="229" font-family="'Segoe UI',Inter,system-ui,sans-serif"
          font-size="17" fill="#64748b">
      for ADL and error-correction models — with delta-method standard errors.
    </text>

    <!-- capability pills -->
    <g font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="13.5" font-weight="600">
      <rect x="0" y="252" width="54" height="29" rx="14.5" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="27" y="271.5" fill="#4338ca" text-anchor="middle">ADL</text>

      <rect x="64" y="252" width="68" height="29" rx="14.5" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="98" y="271.5" fill="#0e7490" text-anchor="middle">GECM</text>

      <rect x="142" y="252" width="56" height="29" rx="14.5" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="170" y="271.5" fill="#0f766e" text-anchor="middle">IRF</text>

      <rect x="208" y="252" width="56" height="29" rx="14.5" fill="#fffbeb" stroke="#fde68a"/>
      <text x="236" y="271.5" fill="#b45309" text-anchor="middle">LRM</text>

      <rect x="274" y="252" width="118" height="29" rx="14.5" fill="#fdf2f8" stroke="#fbcfe8"/>
      <text x="333" y="271.5" fill="#be185d" text-anchor="middle">Interactions</text>

      <rect x="402" y="252" width="128" height="29" rx="14.5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="466" y="271.5" fill="#475569" text-anchor="middle">pip install</text>
    </g>
  </g>

  <!-- ====================== right: the response function ==================== -->
  <g transform="translate(726,44)" filter="url(#soft)">
    <rect x="0" y="0" width="486" height="252" rx="18" fill="#ffffff" stroke="#e3e9f2"/>

    <!-- the Parula strip, naming the default colour scale -->
    <rect x="26" y="22" width="190" height="7" rx="3.5" fill="url(#parula)"/>
    <text x="224" y="29" font-family="'Segoe UI',Inter,system-ui,sans-serif"
          font-size="11.5" fill="#94a3b8">Parula</text>

    <!-- axes -->
    <line x1="52" y1="214" x2="446" y2="214" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="52" y1="56"  x2="52"  y2="214" stroke="#94a3b8" stroke-width="1.4"/>

    <!-- zero line -->
    <line x1="52" y1="196" x2="446" y2="196" stroke="#cbd5e1" stroke-width="1.2"
          stroke-dasharray="4 4"/>

    <!-- step response: confidence band then the path -->
    <path d="M52 196 L52 172 C120 118 200 92 300 84 L386 80 L386 196 Z" fill="url(#band)"/>
    <path d="M52 196 C120 150 200 122 300 114 L386 110"
          fill="none" stroke="#4f46e5" stroke-width="3.6" stroke-linecap="round"/>

    <!-- impulse response: decays back to zero -->
    <path d="M52 196 L70 150 C110 176 170 192 260 195 L386 196 L386 196 Z" fill="url(#bandb)"/>
    <path d="M52 196 L70 158 C110 180 170 193 260 195 L386 196"
          fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="7 5"/>

    <!-- the long-run multiplier, set apart past the path -->
    <line x1="418" y1="78" x2="418" y2="142" stroke="#f59e0b" stroke-width="3.4"
          stroke-linecap="round"/>
    <circle cx="418" cy="110" r="6.5" fill="#f59e0b"/>
    <text x="418" y="232" font-family="'Segoe UI',Inter,system-ui,sans-serif"
          font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">LRM</text>

    <!-- axis labels -->
    <text x="249" y="238" font-family="'Segoe UI',Inter,system-ui,sans-serif"
          font-size="12.5" fill="#64748b" text-anchor="middle">periods since the shock (s)</text>
    <text x="24" y="135" font-family="'Segoe UI',Inter,system-ui,sans-serif"
          font-size="12.5" fill="#64748b" text-anchor="middle"
          transform="rotate(-90 24 135)">response of y</text>

    <!-- legend -->
    <g font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="12.5">
      <line x1="262" y1="52" x2="288" y2="52" stroke="#4f46e5" stroke-width="3.4"
            stroke-linecap="round"/>
      <text x="295" y="56" fill="#475569">step</text>

      <line x1="344" y1="52" x2="370" y2="52" stroke="#0d9488" stroke-width="3"
            stroke-dasharray="7 5" stroke-linecap="round"/>
      <text x="377" y="56" fill="#475569">impulse</text>
    </g>
  </g>
</svg>
